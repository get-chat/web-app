# pnpm settings live here rather than in the `pnpm` field of package.json:
# pnpm no longer reads that field and silently ignores whatever it contains.

# HACK: override `nth-check`
# Override the `nth-check` indirect project dependency, to use its
# non-vulnerable version.
# For details, please see:
# https://gitlab.com/wabbitproject/web-app/-/merge_requests/84#note_933930067
overrides:
  nth-check: ^2.0.1

# pnpm does not run dependency build (postinstall) scripts unless they are
# approved here, and fails the install on any it had to block. Every package
# shipping one needs an explicit true/false, so a newly introduced build script
# surfaces as a failed install rather than as silently missing native code.
allowBuilds:
  # Builds/links the platform `sentry-cli` binary the webpack plugin shells out to.
  '@sentry/cli': true
  # Native modules with platform-specific binaries.
  '@parcel/watcher': true
  unrs-resolver: true
  # Install script only prints a funding banner.
  core-js: false
  core-js-pure: false
  # E2E runs on Playwright, so the Cypress binary download is dead weight.
  cypress: false
